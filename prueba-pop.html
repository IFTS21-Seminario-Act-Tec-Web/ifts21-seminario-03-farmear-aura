
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pop-up Nativo con HTML</title>
<!-- 1. El botón que activa el pop-up -->





<button popovertarget="mi-popup">Abrir Pop-up</button>

<!-- 2. El elemento que actúa como pop-up -->
<div id="mi-popup" popover>
  <h2>¡Hola!</h2>
  <p>Este es un elemento emergente creado de forma nativa con HTML.</p>
  
  <!-- Botón para cerrar el pop-up -->
  <button popovertarget="mi-popup" popovertargetaction="hide">Cerrar</button>
</div>
  </head>
  <body>
    <h1>Ejemplo de Pop-up Nativo con HTML</h1>
