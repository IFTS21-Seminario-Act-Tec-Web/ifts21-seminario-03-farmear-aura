<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta — Farmear Aura</title>

  <!-- Tipografias  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap + iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos -->
  <link rel="stylesheet" href="../assets/css/login.css">
  <link rel="stylesheet" href="../assets/css/registro.css">
  <link rel="stylesheet" href="../assets/css/formulario.css">  
</head>

<body class="fa-login-page">

  <main class="fa-login fa-login-wide">

    <a class="fa-login-brand" href="../index.html">FARMEAR <span>AURA</span></a>

    <p class="fa-login-eyebrow">Unite a la aventura</p>
    <h1>Crear <span>cuenta</span></h1>
    <p class="fa-login-subtitle">Registrate para reservar salas y seguir tus partidas.</p>

    <form id="registroForm" novalidate>

      <div class="fa-login-cols">
        <div class="fa-login-field">
          <label class="fa-login-label" for="nombre">Nombre</label>
          <input class="fa-login-input" type="text" id="nombre" name="nombre"
                 placeholder="Nombre" autocomplete="given-name" required>
          <span class="fa-login-field-error"></span>
        </div>

        <div class="fa-login-field">
          <label class="fa-login-label" for="apellido">Apellido</label>
          <input class="fa-login-input" type="text" id="apellido" name="apellido"
                 placeholder="Apellido" autocomplete="family-name" required>
          <span class="fa-login-field-error"></span>
        </div>
      </div>

      <div class="fa-login-field">
        <label class="fa-login-label" for="usuario">Nombre de usuario</label>
        <input class="fa-login-input" type="text" id="usuario" name="usuario"
               placeholder="Nombre de usuario" autocomplete="username" minlength="3" required>
        <span class="fa-login-hint">Mínimo 3 caracteres, sin espacios.</span>
        <span class="fa-login-field-error"></span>
      </div>

      <div class="fa-login-field">
        <label class="fa-login-label" for="email">Email</label>
        <input class="fa-login-input" type="email" id="email" name="email"
               placeholder="tu@email.com" autocomplete="email" required>
        <span class="fa-login-field-error"></span>
      </div>

      <div class="fa-login-field">
        <label class="fa-login-label" for="password">Contraseña</label>
        <div class="fa-login-pass">
          <input class="fa-login-input fa-login-input-pass" type="password" id="password" name="password"
                 placeholder="••••••••" autocomplete="new-password" required>
          <button class="fa-login-toggle" type="button" data-toggle="password" aria-label="Mostrar contraseña">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="fa-login-strength" id="strengthBar" data-level="0"><i></i><i></i><i></i><i></i></div>
        <span class="fa-login-strength-label" id="strengthLabel"></span>
        <span class="fa-login-field-error"></span>
      </div>

      <div class="fa-login-field">
        <label class="fa-login-label" for="password2">Repetir contraseña</label>
        <div class="fa-login-pass">
          <input class="fa-login-input fa-login-input-pass" type="password" id="password2" name="password2"
                 placeholder="Repetí la contraseña" autocomplete="new-password" required>
          <button class="fa-login-toggle" type="button" data-toggle="password2" aria-label="Mostrar contraseña">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <span class="fa-login-field-error"></span>
      </div>

      <label class="fa-login-check fa-login-terms">
        <input type="checkbox" id="terminos" name="terminos">
        <span>Acepto los <a href="#">términos y condiciones</a> y la <a href="#">política de privacidad</a>.</span>
      </label>

      <span class="fa-login-error" id="registroError" role="alert"></span>

      <button class="fa-login-btn" type="submit">Crear cuenta</button>

    </form>

    <p class="fa-login-foot">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>

  </main>

<script src="../assets/js/registro.js"></script>

</body>
</html>
