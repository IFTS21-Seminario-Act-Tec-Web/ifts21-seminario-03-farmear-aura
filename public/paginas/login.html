<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Farmear Aura</title>

  <!-- Tipografías (las mismas que index.html) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap + íconos, igual que en index.html -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body class="fa-login-page">

  <main class="fa-login">

    <a class="fa-login-brand" href="../index.html">FARMEAR <span> AURA </span></a>

    <p class="fa-login-eyebrow">Bienvenido de vuelta</p>
    <h1>Iniciar <span>sesión</span></h1>
    <p class="fa-login-subtitle">Ingresá para ver y gestionar tus reservas.</p>

    <form id="loginForm" novalidate>

      <div class="fa-login-field">
        <label class="fa-login-label" for="email">Email</label>
        <input class="fa-login-input" type="email" id="email" name="email"
               placeholder="tu@email.com" autocomplete="email" required>
      </div>

      <div class="fa-login-field">
        <label class="fa-login-label" for="password">Contraseña</label>
        <input class="fa-login-input fa-login-input-pass" type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required>
        <button class="fa-login-toggle" type="button" id="togglePass" aria-label="Mostrar contraseña">
          <i class="bi bi-eye"></i>
        </button>
      </div>

      <div class="fa-login-row">
        <label class="fa-login-check">
          <input type="checkbox" name="remember"> Recordarme
        </label>
        <a class="fa-login-link" href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <span class="fa-login-error" id="loginError" role="alert"></span>

      <button class="fa-login-btn" type="submit">Ingresar</button>

      <div class="fa-login-divider">o</div>

      <button class="fa-login-btn fa-login-btn-outline" type="button">
        <i class="bi bi-google"></i> Continuar con Google
      </button>

    </form>

    <p class="fa-login-foot">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>

  </main>
  <script src="../assets/js/login.js"></script>
</body>
</html>
